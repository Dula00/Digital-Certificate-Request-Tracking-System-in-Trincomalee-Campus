<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification | Trincomalee Campus</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; border-top: 5px solid #10b981; }
        .logo { width: 80px; margin-bottom: 15px; }
        .status-badge { background: #dcfce7; color: #15803d; padding: 8px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .info-row { text-align: left; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label { font-size: 12px; color: #666; display: block; }
        .value { font-size: 16px; font-weight: 600; color: #333; }
        .error-msg { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="verify-box">
    <img src="assets/logo.png" alt="University Logo" class="logo">
    <div id="loading">Checking Record...</div>
    
    <div id="content" style="display: none;">
        <div class="status-badge">✔ VERIFIED AUTHENTIC</div>
        
        <div class="info-row">
            <span class="label">Student Full Name</span>
            <span class="value" id="studentName"></span>
        </div>
        <div class="info-row">
            <span class="label">Degree Program</span>
            <span class="value" id="degreeName"></span>
        </div>
        <div class="info-row">
            <span class="label">Class / Pass</span>
            <span class="value" id="class"></span>
        </div>
        <div class="info-row">
            <span class="label">Graduated Year</span>
            <span class="value" id="graduatedYear"></span>
        </div>
        
        <p style="font-size: 11px; color: #999; margin-top: 20px;">This is a digitally verified document from the Eastern University, Sri Lanka.</p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. URL එකෙන් ID එක ගන්න (e.g., verify.html?id=EUSL/TC/IS/01)
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');

        if (!studentId) {
            document.getElementById('verify-box').innerHTML = "<p class='error-msg'>No Certificate ID Provided.</p>";
            return;
        }

        // 2. ඔයා හදපු Backend API එකට Call කරනවා
        fetch(`http://localhost:3000/api/verify/${encodeURIComponent(studentId)}`)
            .then(response => response.json())
            .then(res => {
                document.getElementById('loading').style.display = 'none';
                
                if (res.success) {
                    // 3. දත්ත ටික පේජ් එකට දානවා
                    document.getElementById('content').style.display = 'block';
                    document.getElementById('studentName').innerText = res.data.fullName;
                    document.getElementById('degreeName').innerText = res.data.degreeName;
                    document.getElementById('class').innerText = res.data.class;
                    document.getElementById('graduatedYear').innerText = res.data.graduatedYear;
                } else {
                    document.getElementById('verify-box').innerHTML = `<p class='error-msg'>❌ ${res.message}</p>`;
                }
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('verify-box').innerHTML = "<p class='error-msg'>Server Connection Error.</p>";
            });
    });
</script>

</body>
</html>
